<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6MWT 六分鐘步行測試計算器</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#193447;background:#edf4f7}*{box-sizing:border-box}body{margin:0}.head{background:#153f56;color:#fff;padding:25px 20px}.head>div{max-width:1000px;margin:auto}h1{font-size:25px;margin:0 0 8px}.head p{margin:0;color:#d7e8ef}.wrap{max-width:1000px;margin:20px auto;padding:0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.panel{background:#fff;padding:23px;border-radius:13px;box-shadow:0 3px 12px #12395010;margin-bottom:18px}h2{font-size:18px;color:#176281;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:14px;font-weight:650;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #bdd0dc;border-radius:8px;padding:11px;font:inherit;background:white}.field input:focus,.field select:focus{outline:2px solid #72bbdd}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{background:#eff7fa;border-radius:10px;padding:16px;min-height:115px}.metric span{display:block;font-size:13px;font-weight:650;color:#405f70}.metric strong{font-size:27px;color:#116b96;display:block;margin:8px 0 4px}.metric small{font-size:12px;color:#5c7887}button{background:#e3edf3;color:#24536a;border:0;padding:11px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700}.actions{margin-top:15px;display:flex;justify-content:flex-end}@media(max-width:740px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}@media(max-width:410px){.fields{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric strong{font-size:23px}}

/* Upper input fields and selectors: 26px, responsive and aligned */
.field{min-width:0}
.field input,.field select{font-size:26px;line-height:1.3;min-height:60px;padding:10px 12px;min-width:0;font-variant-numeric:tabular-nums}
.field select{padding-right:8px}
@media(max-width:410px){.field input,.field select{font-size:26px}}
/* Enlarged calculation results with stable alignment */
.wrap{max-width:1120px}
.result-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:22px;row-gap:12px;align-items:center}
.result-line{display:grid;grid-template-columns:minmax(0,1fr) 145px 65px;align-items:center;gap:8px;min-width:0;font-size:17px}
.result-line label{font-weight:650;color:#223f50;white-space:nowrap;min-width:0}
.result-line output{display:block;min-height:50px;padding:7px 9px;border:1px solid #a6bac6;border-radius:5px;background:#f5f9fc;text-align:right;font-size:26px;font-variant-numeric:tabular-nums;color:#116b96;font-weight:700;white-space:nowrap}
.result-line span{white-space:nowrap;color:#405f70;font-size:16px}
.dsp-line{grid-column:1/-1;display:grid;grid-template-columns:minmax(245px,1fr) 145px 55px 95px 45px 145px;justify-content:start;gap:9px}
.dsp-line label{white-space:nowrap}.dsp-line output,.dsp-line output#dspSpo,.dsp-line output#dsp{width:100%}
@media(max-width:1100px){.result-layout{grid-template-columns:1fr}.dsp-line{grid-column:1;grid-template-columns:minmax(245px,1fr) 145px 55px 95px 45px 145px}}
@media(max-width:680px){.dsp-line{display:flex;flex-wrap:wrap;align-items:center}.dsp-line label{width:100%}.dsp-line output{width:145px!important}.dsp-line output#dspSpo{width:95px!important}.dsp-line output#dsp{width:145px!important}}
@media(max-width:450px){.result-line{font-size:16px;grid-template-columns:minmax(0,1fr) 130px 57px;gap:5px}.result-line output{font-size:26px;min-height:48px;padding:6px 5px}.result-line span{font-size:14px}.dsp-line{gap:7px}.dsp-line label{white-space:normal}}
</style></head><body><header class="head"><div><h1>六分鐘步行測試 6MWT</h1><p>依院內 Excel 公式｜單機離線・輸入即時計算</p></div></header><main class="wrap"><div class="grid"><section class="panel"><h2>01｜計算基本資料</h2><div class="fields"><div class="field"><label for="sex">性別</label><select id="sex"><option value="M">男</option><option value="F">女</option></select></div><div class="field"><label for="age">年齡（歲）</label><input id="age" type="number" min="1" max="120" step="1"></div><div class="field"><label for="height">身高（cm）</label><input id="height" type="number" min="60" max="230" step="0.1"></div><div class="field"><label for="weight">體重（kg）</label><input id="weight" type="number" min="10" max="350" step="0.1"></div></div></section><section class="panel"><h2>02｜步行測試數據</h2><div class="fields"><div class="field"><label for="lapLength">每圈距離（m）</label><select id="lapLength"><option value="10">10 m</option><option value="20">20 m</option></select></div><div class="field"><label for="laps">完成圈數</label><input id="laps" type="number" min="0" step="1"></div><div class="field"><label for="extra">額外距離（m）</label><input id="extra" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="minSpo2">最低 SpO₂（%）</label><input id="minSpo2" type="number" min="0" max="100" step="0.1"></div></div></section></div><section class="panel"><h2>03｜即時計算結果</h2>
<div class="result-layout">
  <div class="result-line"><label>Target distance (LLN)：</label><output id="target">—</output><span>meters</span></div>
  <div class="result-line"><label>Pred：</label><output id="pred">—</output><span>%</span></div>
  <div class="result-line"><label>實際行走距離：</label><output id="distance">—</output><span>meters</span></div>
  <div class="result-line"><label>Submaximal HR：</label><output id="subhr">—</output><span>bpm</span></div>
  <div class="result-line"><label>行走速率：</label><output id="speed">—</output><span>m/sec</span></div>
  <div class="result-line"><label>行走功率：</label><output id="power">—</output><span>m/kg</span></div>
  <div class="result-line dsp-line"><label>distant saturation production：</label><output id="dspDistance">—</output><span>(m) ×</span><output id="dspSpo">—</output><span>% =</span><output id="dsp">—</output></div>
</div><div class="actions"><button type="button" id="reset">清空重算</button></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);const number=id=>$(id).value.trim()===''?NaN:Number($(id).value);const check=(v,lo,hi)=>Number.isFinite(v)&&v>=lo&&v<=hi;const show=(id,n,d=1)=>$(id).textContent=Number.isFinite(n)?n.toFixed(d):'—';function calc(){let a=number('age'),h=number('height'),w=number('weight'),len=number('lapLength'),laps=number('laps'),extra=number('extra'),spo=number('minSpo2');let basic=check(a,1,120)&&Number.isInteger(a)&&check(h,60,230)&&check(w,10,350);let walk=check(len,.01,10000)&&check(laps,0,100000)&&Number.isInteger(laps)&&check(extra,0,10000)&&extra<len;let distance=walk?len*laps+extra:NaN;let male=basic?7.57*h-5.02*a-1.76*w-309:NaN;let female=basic?2.11*h-2.29*a-5.78*w+667:NaN;let target=$('sex').value==='M'?male:female;show('distance',distance);show('target',target);show('pred',target>0?distance/target*100:NaN);show('speed',distance/360,2);show('power',distance/w,2);show('dspDistance',distance);show('dspSpo',check(spo,0,100)?spo:NaN);show('dsp',check(spo,0,100)?distance*spo/100:NaN);show('subhr',check(a,1,120)?220-a:NaN,0)}document.querySelectorAll('input,select').forEach(x=>{x.addEventListener('input',calc);x.addEventListener('change',calc)});$('reset').addEventListener('click',()=>{for(const id of ['age','height','weight','laps','minSpo2'])$(id).value='';$('lapLength').value='10';$('extra').value='0';$('sex').value='M';calc()});calc();
</script></body></html>
